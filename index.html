<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outstanding Dashboard</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:Segoe UI,Arial;color:#13233d}.wrap{padding:16px}.hero{background:linear-gradient(120deg,#092d5c,#1767d8);color:#fff;padding:22px;border-radius:18px}.stamp{display:inline-block;background:#e7f7ea;color:#08752b;padding:8px 12px;border-radius:9px;font-weight:700}.files{margin-top:10px;font-size:13px;overflow-wrap:anywhere}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.card{background:#fff;border-left:5px solid #1976d2;border-radius:13px;padding:13px;cursor:pointer}.card b{display:block;font-size:23px;margin-top:6px}.card.active{outline:3px solid #8ec1ff}.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:#fff;padding:12px;border-radius:14px}.f label{display:block;font-size:11px;color:#64748b;margin-bottom:3px}.f input,.f select,.tools button{width:100%;padding:9px;border:1px solid #ccd6e5;border-radius:8px;background:#fff}.tools button{background:#107c41;color:#fff;font-weight:700;border:0;align-self:end}.tablebox{margin-top:12px;background:#fff;border-radius:14px;overflow:auto;max-height:58vh}table{border-collapse:collapse;width:100%;min-width:1500px}th{position:sticky;top:0;background:#0d3565;color:#fff;padding:9px;text-align:left}td{padding:8px;border-bottom:1px solid #e1e8f2}.num{text-align:right}.bad{color:#b42318;font-weight:700}.count{padding:10px;color:#607089}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr 1fr}.tablebox{background:transparent;overflow:visible;max-height:none}table,thead,tbody,tr,td{display:block}table{min-width:0}thead{display:none}tbody{display:grid;gap:9px}tr{background:#fff;border-radius:12px;padding:8px}td{display:grid;grid-template-columns:43% 57%;text-align:right!important}td:before{content:attr(data-label);font-weight:700;text-align:left;color:#28496f}}@media(max-width:520px){.tools{grid-template-columns:1fr}}.card{border:0;text-align:left;font:inherit}.card small{display:block;color:#607089;margin-top:6px;line-height:1.25}.pager{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;background:#fff}.pager button,.pager select{padding:8px 12px;border:1px solid #bdd0e8;border-radius:8px;background:#fff}.empty{padding:30px;text-align:center;color:#607089;font-weight:600}@media(max-width:520px){.pager{flex-wrap:wrap}.card small{font-size:11px}}</style></head><body><div class="wrap"><div class="hero"><h1>Outstanding Reconciliation Dashboard</h1><div id="stamp" class="stamp"></div><div id="files" class="files"></div></div><div id="cards" class="cards"></div><div class="tools"><div class="f"><label>Search</label><input id="q" list="sug" placeholder="Invoice, party, code"><datalist id="sug"></datalist></div><div class="f"><label>Party Name</label><input id="party" list="ps"><datalist id="ps"></datalist></div><div class="f"><label>Comparison Scope</label><select id="scope"><option value="PREFIX COMPARISON">Prefix Comparison Only</option><option value="">All Bills</option><option value="IGNORED OTHER BILLS">Ignored Other Bills</option></select></div><div class="f"><label>Result</label><select id="result"><option value="">All Results</option></select></div><div class="f"><label>Bill Family</label><select id="family"><option value="">All Families</option><option>E-DUKAN</option><option>ALIGNBOOK</option><option>OTHER</option></select></div><div class="f"><label>Date Source</label><select id="dateSource"><option value="billDate">Any Date</option><option value="tallyDate">Tally Date</option><option value="edukanDate">E-Dukan Date</option><option value="alignDate">AlignBook Date</option></select></div><div class="f"><label>From</label><input id="from" type="date"></div><div class="f"><label>To</label><input id="to" type="date"></div><div class="f"><label>Sort By</label><select id="sortBy"><option value="partyName">Party Name</option><option value="invoice">Invoice Number</option><option value="billDate">Bill Date</option><option value="partyCode">Party Code</option><option value="pendingDifference">Pending Difference</option></select></div><div class="f"><label>Order</label><select id="order"><option value="asc">A-Z / Low-High</option><option value="desc">Z-A / High-Low</option></select></div><button onclick="download()">Download XLSX</button><button onclick="clearAll()">Clear</button></div><div class="tablebox"><table><thead><tr><th>Invoice Number</th><th>Bill Date</th><th>Party Code</th><th>Party Name</th><th>Tally Opening</th><th>Tally Pending</th><th>E-Dukan Opening</th><th>E-Dukan Pending</th><th>AlignBook Opening</th><th>AlignBook Pending</th><th>Pending Difference</th></tr></thead><tbody id="body"></tbody></table><div id="count" class="count"></div><div class="pager"><button id="prev" type="button">◀ Previous</button><span id="pageInfo"></span><button id="next" type="button">Next ▶</button><select id="pageSize"><option>50</option><option selected>100</option><option>250</option></select></div></div></div><script src="data.js"></script><script>const D=window.OUTSTANDING_DATA||{rows:[],kpis:{},meta:{}};let active='';let page=1;const $=x=>document.getElementById(x),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});$('stamp').textContent='● Dashboard Updated: '+D.meta.dashboardUpdatedAt;$('files').textContent=`${D.meta.tallyFile} | ${D.meta.alignFile} | ${D.meta.edukanFile} | Prefix Audit ${D.meta.auditRows}/40`;
const defs=[
['E-Dukan bills missing in Tally','eduNotTally','E-DUKAN NOT IN TALLY','Pending in E-Dukan, but not found in Tally'],
['Tally E-Dukan bills missing in E-Dukan','tallyEduNotSource','TALLY E-DUKAN NOT IN SOURCE','Found in Tally, but not in the pending E-Dukan list'],
['AlignBook bills missing in Tally','alignNotTally','ALIGNBOOK NOT IN TALLY','Pending in AlignBook, but not found in Tally'],
['Tally AlignBook bills missing in AlignBook','tallyAlignNotSource','TALLY ALIGNBOOK NOT IN SOURCE','Found in Tally, but not in AlignBook'],
['E-Dukan bills matched','matchedEdu','MATCHED E-DUKAN','The same pending bill exists in E-Dukan and Tally'],
['AlignBook bills matched','matchedAlign','MATCHED ALIGNBOOK','The same pending bill exists in AlignBook and Tally'],
['Other Tally entries ignored','ignoredOther','IGNORED OTHER BILL','EXCESS, IMPS and other non-invoice entries are not compared'],
['Needs checking','manualReview','MANUAL REVIEW','Records that need a person to check']];$('cards').innerHTML=defs.map(x=>`<button type="button" class="card" data-r="${x[2]}"><span>${x[0]}</span><b>${D.kpis[x[1]]||0}</b><small>${x[3]}</small></button>`).join('');[...$('cards').children].forEach(c=>c.onclick=()=>{const next=active===c.dataset.r?'':c.dataset.r;active=next;$('result').value=next;$('scope').value=next==='IGNORED OTHER BILL'?'IGNORED OTHER BILLS':'PREFIX COMPARISON';if(next.startsWith('E-DUKAN')||next.includes(' E-DUKAN'))$('family').value='E-DUKAN';else if(next.startsWith('ALIGNBOOK')||next.includes(' ALIGNBOOK'))$('family').value='ALIGNBOOK';else $('family').value='';[...$('cards').children].forEach(x=>x.classList.toggle('active',x.dataset.r===next));page=1;render()});[...new Set(D.rows.map(x=>x.result))].sort().forEach(x=>$('result').add(new Option(x,x)));$('ps').innerHTML=[...new Set(D.rows.map(x=>x.partyName).filter(Boolean))].sort().map(x=>`<option value="${x.replace(/"/g,'&quot;')}">`).join('');$('sug').innerHTML=[...new Set(D.rows.flatMap(x=>[x.invoice,x.partyCode,x.partyName]).filter(Boolean))].slice(0,5000).map(x=>`<option value="${String(x).replace(/"/g,'&quot;')}">`).join('');const ids=['q','party','scope','result','family','dateSource','from','to','sortBy','order'];let debounceTimer;const queueRender=()=>{clearTimeout(debounceTimer);debounceTimer=setTimeout(()=>{page=1;render()},120)};ids.forEach(x=>{$(x).oninput=queueRender;$(x).onchange=()=>{page=1;active='';[...$('cards').children].forEach(c=>c.classList.remove('active'));render()}});function iso(d){let p=String(d||'').split('-');return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:''}function rows(){let q=$('q').value.toLowerCase(),p=$('party').value.toLowerCase(),sc=$('scope').value,r=$('result').value,f=$('family').value,ds=$('dateSource').value,fr=$('from').value,to=$('to').value,a=D.rows.filter(x=>{let d=iso(x[ds]);return(!q||(x.invoice+' '+x.partyCode+' '+x.partyName).toLowerCase().includes(q))&&(!p||x.partyName.toLowerCase().includes(p))&&(!sc||x.comparisonScope===sc)&&(!r||x.result===r)&&(!f||x.sourceFamily===f)&&(!fr||d>=fr)&&(!to||d<=to)}),k=$('sortBy').value,dir=$('order').value==='desc'?-1:1;return a.sort((x,y)=>k==='pendingDifference'?(Number(x[k])-Number(y[k]))*dir:String(x[k]||'').localeCompare(String(y[k]||''),undefined,{numeric:true,sensitivity:'base'})*dir)}const labels=['Invoice Number','Bill Date','Party Code','Party Name','Tally Opening','Tally Pending','E-Dukan Opening','E-Dukan Pending','AlignBook Opening','AlignBook Pending','Pending Difference'];function render(){const all=rows(),size=Number($('pageSize')?.value||100),pages=Math.max(1,Math.ceil(all.length/size));page=Math.min(page,pages);const a=all.slice((page-1)*size,page*size);$('body').innerHTML=a.length?a.map(x=>{let v=[x.invoice,x.billDate,x.partyCode,x.partyName,money(x.tallyOpening),money(x.tallyPending),money(x.edukanOpening),money(x.edukanPending),money(x.alignOpening),money(x.alignPending),money(x.pendingDifference)];return'<tr title="'+x.result+'">'+v.map((z,i)=>`<td data-label="${labels[i]}" class="${i>3?'num':''} ${i===10&&Math.abs(x.pendingDifference)>.01?'bad':''}">${z}</td>`).join('')+'</tr>'}).join(''):'<tr><td class="empty" colspan="11">No bills match these filters. Click Clear and try one filter at a time.</td></tr>';$('count').textContent=`Showing ${all.length?((page-1)*size+1):0}-${Math.min(page*size,all.length)} of ${all.length.toLocaleString('en-IN')} bills`;$('pageInfo').textContent=`Page ${page} of ${pages}`;$('prev').disabled=page<=1;$('next').disabled=page>=pages}
function clearAll(){ids.forEach(x=>$(x).value=x==='scope'?'PREFIX COMPARISON':x==='dateSource'?'billDate':x==='sortBy'?'partyName':x==='order'?'asc':'');active='';page=1;[...$('cards').children].forEach(c=>c.classList.remove('active'));render()}function download(){if(!window.XLSX)return alert('XLSX library not loaded');let a=rows().map(x=>({'Invoice Number':x.invoice,'Bill Date':x.billDate,'Party Code':x.partyCode,'Party Name':x.partyName,'Family':x.sourceFamily,'Result':x.result,'Tally Opening':x.tallyOpening,'Tally Pending':x.tallyPending,'E-Dukan Opening':x.edukanOpening,'E-Dukan Pending':x.edukanPending,'AlignBook Opening':x.alignOpening,'AlignBook Pending':x.alignPending,'Pending Difference':x.pendingDifference})),ws=XLSX.utils.json_to_sheet(a),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Outstanding');XLSX.writeFile(wb,'Outstanding_Filtered_'+new Date().toISOString().slice(0,10)+'.xlsx')}$('prev').onclick=()=>{if(page>1){page--;render();scrollTo({top:document.querySelector('.tablebox').offsetTop-10,behavior:'smooth'})}};$('next').onclick=()=>{page++;render();scrollTo({top:document.querySelector('.tablebox').offsetTop-10,behavior:'smooth'})};$('pageSize').onchange=()=>{page=1;render()};render();</script></body></html>
