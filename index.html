<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outstanding Reconciliation Dashboard</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;font-family:Segoe UI,Arial;color:#12233f}.wrap{padding:18px}.hero{background:linear-gradient(120deg,#092b58,#1766d8);color:#fff;border-radius:20px;padding:24px}.stamp{display:inline-block;background:#e7f7ea;color:#08752b;padding:8px 12px;border-radius:10px;font-weight:700}.files{margin-top:14px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.card{background:#fff;padding:15px;border-radius:15px;border-left:5px solid #1874e8;cursor:pointer}.card.active{outline:3px solid #87baf7}.card b{font-size:24px;display:block;margin-top:7px}.toolbar{display:grid;grid-template-columns:1.3fr 1.1fr 1fr .8fr 1fr 1fr auto auto;gap:10px;background:#fff;padding:14px;border-radius:15px}.field{min-width:0}.field label{display:block;font-size:11px;color:#64748b;margin:0 0 4px 4px}.field input,.field select,.toolbar button{width:100%;padding:10px;border:1px solid #cad5e5;border-radius:9px;background:#fff}.toolbar button{align-self:end;background:#107c41;color:#fff;font-weight:700;border:0;white-space:nowrap}.toolbar .clear{background:#334155}.tablebox{margin-top:14px;background:#fff;border-radius:15px;overflow:auto;max-height:58vh}table{border-collapse:collapse;width:100%;min-width:1500px}th{position:sticky;top:0;background:#0d3565;color:#fff;padding:10px;text-align:left}td{padding:9px;border-bottom:1px solid #e0e7f0}.num{text-align:right}.bad{color:#b42318;font-weight:700}.count{padding:10px;color:#586a83}.mobileLabel{display:none}
@media(max-width:950px){.wrap{padding:8px}.hero{padding:17px;border-radius:14px}.hero h1{font-size:23px}.cards{grid-template-columns:repeat(2,1fr);gap:8px}.card{padding:11px}.card b{font-size:20px}.toolbar{grid-template-columns:1fr 1fr}.field.search,.field.party{grid-column:1/-1}.tablebox{max-height:none;background:transparent;overflow:visible}table,thead,tbody,tr,th,td{display:block}table{min-width:0}thead{display:none}tbody{display:grid;gap:10px}tr{background:#fff;border-radius:13px;padding:9px;box-shadow:0 2px 8px #dbe3ee}td{display:grid;grid-template-columns:43% 57%;padding:7px;border-bottom:1px solid #edf1f6;text-align:right!important;overflow-wrap:anywhere}td:before{content:attr(data-label);font-weight:700;text-align:left;color:#244466}.count{background:#fff;border-radius:10px;margin-top:8px}}
@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.field.search,.field.party{grid-column:auto}.toolbar button{width:100%}.files{overflow-wrap:anywhere}}
</style></head><body><div class="wrap"><div class="hero"><h1>Outstanding Reconciliation Dashboard</h1><div id="stamp" class="stamp"></div><div id="files" class="files"></div></div><div id="cards" class="cards"></div>
<div class="toolbar">
<div class="field search"><label>Invoice, party or code</label><input id="q" list="searchSuggestions" placeholder="Search invoice, party or code"><datalist id="searchSuggestions"></datalist></div>
<div class="field party"><label>Party Name / Description</label><input id="party" list="partySuggestions" placeholder="Select or type party name"><datalist id="partySuggestions"></datalist></div>
<div class="field"><label>Result</label><select id="result"><option value="">All Results</option></select></div>
<div class="field"><label>Bill Type</label><select id="billType"><option value="">All Bill Types</option><option>FREIGHT</option><option>STANDARD</option></select></div>
<div class="field"><label>Date Source</label><select id="dateSource"><option value="billDate">Any Available Date</option><option value="tallyDate">Tally Bill Date</option><option value="edukanDate">E-Dukan Order Date</option><option value="alignDate">AlignBook Bill Date</option></select></div>
<div class="field"><label>From Date</label><input id="fromDate" type="date"></div><div class="field"><label>To Date</label><input id="toDate" type="date"></div>
<button onclick="downloadXlsx()">Download XLSX</button><button class="clear" onclick="clearFilters()">Clear</button></div>
<div class="tablebox"><table><thead><tr><th>Invoice Number</th><th>Bill Date</th><th>Party Code</th><th>Party Name</th><th>Tally Opening</th><th>Tally Pending</th><th>E-Dukan Opening</th><th>E-Dukan Pending</th><th>AlignBook Opening</th><th>AlignBook Pending</th><th>Pending Difference</th></tr></thead><tbody id="body"></tbody></table><div id="count" class="count"></div></div></div><script src="data.js"></script><script>
const D=window.OUTSTANDING_DATA||{rows:[],kpis:{},meta:{}};let active='';const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const ids=['q','party','result','billType','dateSource','fromDate','toDate'];const el=id=>document.getElementById(id);el('stamp').textContent='● Dashboard Updated: '+(D.meta.dashboardUpdatedAt||'Not available');el('files').textContent=`${D.meta.tallyFile||''} | ${D.meta.alignFile||''} | ${D.meta.edukanFile||''} | Audit: ${D.meta.auditRows||0}/40`;
const defs=[['Manual Review','manualReview','MANUAL REVIEW'],['Tally Not in AlignBook','tallyNotAlign','TALLY NOT IN ALIGNBOOK'],['Tally Not in E-Dukan','tallyNotEdu','TALLY NOT IN E-DUKAN'],['Tally Not in Both','tallyNotBoth','TALLY NOT IN BOTH'],['All Source Bills Not in Tally','allSourceNotTally','SOURCE NOT TALLY'],['AlignBook Not in Tally','alignNotTally','ALIGNBOOK NOT IN TALLY'],['E-Dukan Not in Tally','eduNotTally','E-DUKAN NOT IN TALLY'],['Both Sources Not in Tally','bothNotTally','BOTH SOURCES NOT IN TALLY']];
el('cards').innerHTML=defs.map(x=>`<div class="card" data-filter="${x[2]}"><span>${x[0]}</span><b>${D.kpis[x[1]]||0}</b></div>`).join('');[...el('cards').children].forEach(c=>c.onclick=()=>{active=active===c.dataset.filter?'':c.dataset.filter;[...el('cards').children].forEach(x=>x.classList.toggle('active',x===c&&!!active));render()});
[...new Set(D.rows.map(r=>r.result))].sort().forEach(v=>el('result').add(new Option(v,v)));const parties=[...new Set(D.rows.map(r=>r.partyName).filter(Boolean))].sort();el('partySuggestions').innerHTML=parties.map(v=>`<option value="${v.replace(/"/g,'&quot;')}">`).join('');el('searchSuggestions').innerHTML=[...new Set(D.rows.flatMap(r=>[r.invoice,r.partyCode,r.partyName]).filter(Boolean))].slice(0,5000).map(v=>`<option value="${String(v).replace(/"/g,'&quot;')}">`).join('');ids.forEach(id=>{el(id).oninput=render;el(id).onchange=render});
function iso(d){if(!d)return'';let p=d.split('-');return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:''}function filtered(){let s=el('q').value.trim().toLowerCase(),p=el('party').value.trim().toLowerCase(),r=el('result').value,b=el('billType').value,ds=el('dateSource').value,f=el('fromDate').value,t=el('toDate').value;return D.rows.filter(x=>{let d=iso(x[ds]||x.billDate);return(!s||(x.invoice+' '+x.partyCode+' '+x.partyName).toLowerCase().includes(s))&&(!p||x.partyName.toLowerCase().includes(p))&&(!r||x.result===r)&&(!b||x.billType===b)&&(!f||d>=f)&&(!t||d<=t)&&(!active||(active==='SOURCE NOT TALLY'?['ALIGNBOOK NOT IN TALLY','E-DUKAN NOT IN TALLY','BOTH SOURCES NOT IN TALLY'].includes(x.result):x.result===active))})}
const labels=['Invoice Number','Bill Date','Party Code','Party Name','Tally Opening','Tally Pending','E-Dukan Opening','E-Dukan Pending','AlignBook Opening','AlignBook Pending','Pending Difference'];function render(){let a=filtered();el('body').innerHTML=a.map(x=>{let vals=[x.invoice,x.billDate,x.partyCode,x.partyName,money(x.tallyOpening),money(x.tallyPending),money(x.edukanOpening),money(x.edukanPending),money(x.alignOpening),money(x.alignPending),money(x.pendingDifference)];return`<tr title="${x.result}">`+vals.map((v,i)=>`<td data-label="${labels[i]}" class="${i>3?'num':''} ${i===10&&Math.abs(x.pendingDifference)>.01?'bad':''}">${v}</td>`).join('')+'</tr>'}).join('');el('count').textContent=`Showing ${a.length.toLocaleString('en-IN')} bills`}
function clearFilters(){ids.forEach(id=>el(id).value=id==='dateSource'?'billDate':'');active='';[...el('cards').children].forEach(x=>x.classList.remove('active'));render()}
function downloadXlsx(){if(!window.XLSX){alert('XLSX export library did not load. Check the internet connection and refresh.');return}let data=filtered().map(x=>({'Invoice Number':x.invoice,'Bill Date':x.billDate,'Party Code':x.partyCode,'Party Name':x.partyName,'Bill Type':x.billType,'Tally Opening':x.tallyOpening,'Tally Pending':x.tallyPending,'E-Dukan Opening':x.edukanOpening,'E-Dukan Pending':x.edukanPending,'AlignBook Opening':x.alignOpening,'AlignBook Pending':x.alignPending,'Pending Difference':x.pendingDifference,'Result':x.result}));let ws=XLSX.utils.json_to_sheet(data);ws['!cols']=[18,12,14,35,12,15,15,17,17,18,18,18,26].map(w=>({wch:w}));let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Filtered Outstanding');XLSX.writeFile(wb,'Outstanding_Dashboard_Filtered_'+new Date().toISOString().slice(0,10)+'.xlsx')};render();
</script></body></html>
