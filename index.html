<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outstanding Reconciliation Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;font-family:Segoe UI,Arial;color:#12233f}.wrap{padding:18px}.hero{background:linear-gradient(120deg,#092b58,#1766d8);color:white;border-radius:20px;padding:24px}.stamp{display:inline-block;background:#e7f7ea;color:#08752b;padding:8px 12px;border-radius:10px;font-weight:700}.files{margin-top:14px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.card{background:white;padding:16px;border-radius:15px;border-left:5px solid #1874e8;cursor:pointer}.card.active{outline:3px solid #87baf7}.card b{font-size:25px;display:block;margin-top:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;background:white;padding:14px;border-radius:15px}.toolbar input,.toolbar select,.toolbar button{padding:10px;border:1px solid #cad5e5;border-radius:9px}.toolbar button{background:#107c41;color:white;font-weight:700;border:0}.tablebox{margin-top:14px;background:white;border-radius:15px;overflow:auto;max-height:58vh}table{border-collapse:collapse;width:100%;min-width:1250px}th{position:sticky;top:0;background:#0d3565;color:white;padding:10px;text-align:left}td{padding:9px;border-bottom:1px solid #e0e7f0}.num{text-align:right}.bad{color:#b42318;font-weight:700}.count{padding:10px;color:#586a83}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><div class="hero"><h1>Outstanding Reconciliation Dashboard</h1><div id="stamp" class="stamp"></div><div id="files" class="files"></div></div><div id="cards" class="cards"></div><div class="toolbar"><input id="q" placeholder="Search party, code or invoice"><select id="result"><option value="">All Results</option></select><button onclick="downloadExcel()">Download Excel</button><button onclick="clearFilters()">Clear</button></div><div class="tablebox"><table><thead><tr><th>Invoice Number</th><th>Bill Date</th><th>Party Code</th><th>Party Name</th><th>Tally Opening</th><th>Tally Pending</th><th>E-Dukan Opening</th><th>E-Dukan Pending</th><th>AlignBook Opening</th><th>AlignBook Pending</th><th>Pending Difference</th></tr></thead><tbody id="body"></tbody></table><div id="count" class="count"></div></div></div><script src="data.js"></script><script>
const D=window.OUTSTANDING_DATA||{rows:[],kpis:{},meta:{}};let active='';const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
stamp.textContent='● Dashboard Updated: '+D.meta.dashboardUpdatedAt;files.textContent=`${D.meta.tallyFile} | ${D.meta.alignFile} | ${D.meta.edukanFile} | Audit: ${D.meta.auditRows||0}/40`;
const defs=[['Manual Review','manualReview','MANUAL REVIEW'],['Tally Not in AlignBook','tallyNotAlign','TALLY NOT IN ALIGNBOOK'],['Tally Not in E-Dukan','tallyNotEdu','TALLY NOT IN E-DUKAN'],['Tally Not in Both','tallyNotBoth','TALLY NOT IN BOTH'],['All Source Bills Not in Tally','allSourceNotTally','SOURCE NOT TALLY'],['AlignBook Not in Tally','alignNotTally','ALIGNBOOK NOT IN TALLY'],['E-Dukan Not in Tally','eduNotTally','E-DUKAN NOT IN TALLY'],['Both Sources Not in Tally','bothNotTally','BOTH SOURCES NOT IN TALLY']];
cards.innerHTML=defs.map((x,i)=>`<div class="card" data-filter="${x[2]}"><span>${x[0]}</span><b>${D.kpis[x[1]]||0}</b></div>`).join('');[...cards.children].forEach(c=>c.onclick=()=>{active=active===c.dataset.filter?'':c.dataset.filter;[...cards.children].forEach(x=>x.classList.toggle('active',x===c&&active));render()});
[...new Set(D.rows.map(r=>r.result))].sort().forEach(v=>result.add(new Option(v,v)));q.oninput=render;result.onchange=render;
function filtered(){let s=q.value.toLowerCase(),r=result.value;return D.rows.filter(x=>(!s||(x.invoice+' '+x.partyCode+' '+x.partyName).toLowerCase().includes(s))&&(!r||x.result===r)&&(!active||(active==='SOURCE NOT TALLY'?['ALIGNBOOK NOT IN TALLY','E-DUKAN NOT IN TALLY','BOTH SOURCES NOT IN TALLY'].includes(x.result):x.result===active)))}
function render(){let a=filtered();body.innerHTML=a.map(x=>`<tr title="${x.result} | ${x.invoice}"><td>${x.invoice}</td><td>${x.billDate}</td><td>${x.partyCode}</td><td>${x.partyName}</td><td class="num">${money(x.tallyOpening)}</td><td class="num">${money(x.tallyPending)}</td><td class="num">${money(x.edukanOpening)}</td><td class="num">${money(x.edukanPending)}</td><td class="num">${money(x.alignOpening)}</td><td class="num">${money(x.alignPending)}</td><td class="num ${Math.abs(x.pendingDifference)>.01?'bad':''}">${money(x.pendingDifference)}</td></tr>`).join('');count.textContent=`Showing ${a.length.toLocaleString('en-IN')} bills`}
function clearFilters(){q.value='';result.value='';active='';[...cards.children].forEach(x=>x.classList.remove('active'));render()}
function downloadExcel(){let a=filtered(),h=['Invoice Number','Bill Date','Party Code','Party Name','Tally Opening','Tally Pending','E-Dukan Opening','E-Dukan Pending','AlignBook Opening','AlignBook Pending','Pending Difference'];let html='<table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+a.map(x=>'<tr>'+[x.invoice,x.billDate,x.partyCode,x.partyName,x.tallyOpening,x.tallyPending,x.edukanOpening,x.edukanPending,x.alignOpening,x.alignPending,x.pendingDifference].map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</table>';let b=new Blob(['\ufeff',html],{type:'application/vnd.ms-excel'}),u=URL.createObjectURL(b),z=document.createElement('a');z.href=u;z.download='Outstanding_Filtered_'+new Date().toISOString().slice(0,10)+'.xls';z.click();URL.revokeObjectURL(u)}render();
</script></body></html>
